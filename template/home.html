{% extends "base.html" %}
{% block main %}
<main>
{{ site.home }}
{% if site.posts %}
<section>
<h2 id="news">News</h2>
<ul>
{% for post in site.posts %}
<li><time datetime="{{ post.date | iso }}">{{ post.date | date("%Y-%m-%d") }}</time> <a href="{{ post.url }}">{{ post.title }}</a></li>
{% endfor %}
</ul>
</section>
{% endif %}
</main>
{% endblock %}
